name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite reexecutar a validacao sem empurrar um commit novo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar e testar (x86_64, QEMU/OVMF)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          # A entrada da ação se chama `version`. O nome `zig-version` é
          # ignorado pela ação com um aviso, e a compilação usaria a versão
          # padrão da imagem do runner, e não a versão alvo do projeto.
          version: 0.17.0

      - name: Instalar OVMF
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout --kill-after=15s 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout --kill-after=15s 12m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y ovmf qemu-system-x86

      - name: Verificar a versão do Zig
        run: |
          set -euo pipefail
          actual="$(zig version)"
          echo "a versão do Zig é $actual"
          if [ "$actual" != "0.17.0" ]; then
            echo "::error::a versão alvo do Zig é 0.17.0, e a versão instalada é $actual"
            exit 1
          fi

      - name: Diagnosticar o firmware do QEMU
        run: |
          set -euo pipefail
          echo "os arquivos do firmware encontrados no sistema:"
          find /usr/share /usr/lib -maxdepth 5 -type f \
            \( -name 'OVMF_CODE*' -o -name 'OVMF_VARS*' \) 2>/dev/null | sort || true

      - name: Testes de unidade
        shell: bash
        run: |
          log_file="$(mktemp)"
          if zig build test >"$log_file" 2>&1; then
            cat "$log_file"
          else
            status=$?
            cat "$log_file"
            python3 - "zig build test" "$log_file" <<'PY'
          import pathlib, sys
          label, path = sys.argv[1:]
          text = pathlib.Path(path).read_text(errors="replace")[-3000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
          print(f"::error title={label} failed::{text}")
          PY
            exit "$status"
          fi

      - name: Construir
        shell: bash
        run: |
          log_file="$(mktemp)"
          if zig build >"$log_file" 2>&1; then
            cat "$log_file"
          else
            status=$?
            cat "$log_file"
            python3 - "zig build" "$log_file" <<'PY'
          import pathlib, sys
          label, path = sys.argv[1:]
          text = pathlib.Path(path).read_text(errors="replace")[-3000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
          print(f"::error title={label} failed::{text}")
          PY
            exit "$status"
          fi

      - name: Teste de boot no QEMU
        shell: bash
        run: |
          log_file="$(mktemp)"
          if zig build qemu-test >"$log_file" 2>&1; then
            cat "$log_file"
          else
            status=$?
            cat "$log_file"
            python3 - "zig build qemu-test" "$log_file" <<'PY'
          import pathlib, sys
          label, path = sys.argv[1:]
          text = pathlib.Path(path).read_text(errors="replace")[-3000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
          print(f"::error title={label} failed::{text}")
          PY
            exit "$status"
          fi

      - name: Verificação agregada
        shell: bash
        run: |
          log_file="$(mktemp)"
          if zig build check >"$log_file" 2>&1; then
            cat "$log_file"
          else
            status=$?
            cat "$log_file"
            python3 - "zig build check" "$log_file" <<'PY'
          import pathlib, sys
          label, path = sys.argv[1:]
          text = pathlib.Path(path).read_text(errors="replace")[-3000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
          print(f"::error title={label} failed::{text}")
          PY
            exit "$status"
          fi

      - name: Verificar os artefatos
        run: |
          file zig-out/bin/voryn-boot.efi
          file zig-out/bin/voryn-kernel
          readelf -h zig-out/bin/voryn-kernel | head -12
